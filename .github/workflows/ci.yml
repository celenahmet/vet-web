name: CI/CD Pipeline

# ⚠️ BU IS AKISI GUNLERDIR KIRIKTI (duzeltme 23.08.2026).
# Her adim `working-directory: ./vet-web` diyordu ama depoda oyle bir klasor yok;
# uygulama kokte duruyor. Sonuc: her push'ta CI kirmizi, aralarinda tasarim
# commit'leri de vardi. Kirmizi kalan bir CI, kimsenin bakmadigi bir CI olur.
#
# Node surumu 20'den 22'ye cikarildi: blog prerender betigi tip soyma kullaniyor
# ve Node 22.6+ istiyor (package.json engines).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Prerender ciktisini dogrula
        run: |
          test -f dist/blog/index.html || { echo "blog liste sayfasi uretilmedi"; exit 1; }
          adet=$(find dist/blog -mindepth 2 -name index.html | wc -l)
          echo "prerender edilen yazi sayisi: $adet"
          test "$adet" -ge 1 || { echo "hicbir yazi prerender edilmedi"; exit 1; }
