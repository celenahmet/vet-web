name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './vet-web/package-lock.json'
        
    - name: Install Dependencies
      working-directory: ./vet-web
      run: npm ci
      
    - name: Run Linter
      working-directory: ./vet-web
      run: npm run lint
      
    - name: Build Project
      working-directory: ./vet-web
      run: npm run build
